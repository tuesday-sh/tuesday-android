name: "Packablock Mobile CI/CD/CA (Android + pkablk + pkaput + Play Internal)"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-attest:
    name: "Test Android App, Verify Ledger, Attest SBOM & Publish DNSLink"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Run Android Unit Tests & Assemble Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Setup Bun & Packablock Client (pkablk)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Verify Packablock Supply Chain Ledger (packablock.yaml)
        run: |
          bun install -g github:Packablock/packablock-client
          pkablk check packablock.yaml
          pkablk audit packablock.yaml --visualize

      - name: Set up Go 1.24 (for pkaput Continuous Attestation Engine)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Run pkaput Squash-Release, CycloneDX SBOM & DNSLink Attestation (examples.packablock.com)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          PKABLK_REGISTRY_URL: ${{ secrets.PKABLK_REGISTRY_URL }}
          PKABLK_API_KEY: ${{ secrets.PKABLK_API_KEY }}
        run: |
          git clone --depth 1 https://github.com/aaronbronow/continuous-attestation.git /tmp/ca
          go build -C /tmp/ca -o /tmp/ca/bin/pkaput ./cmd/pkaput
          mkdir -p test/coredns test/fixtures
          cp /tmp/ca/test/coredns/db.layers.example.internal test/coredns/db.layers.example.internal
          cp /tmp/ca/test/fixtures/packablock.policy.yaml test/fixtures/packablock.policy.yaml
          cp /tmp/ca/test/fixtures/ed25519.key.json test/fixtures/ed25519.key.json

          # 1. Record release step & verify Packablock chain via pkaput + official pkablk CLI
          /tmp/ca/bin/pkaput commit-step \
            --chain packablock.yaml \
            --pkg "androidx.compose:compose-bom" \
            --from "2024.09.00" \
            --to "2024.10.00" \
            --reason "M1 Android Brand v1.2 & Play Billing Pro Tier 1 release"
          pkablk check packablock.yaml
          /tmp/ca/bin/pkaput check packablock.yaml

          # 2. Squash OCI layers, generate CycloneDX v1.5 SBOM + DSSEv1 + CARv1 bundle
          /tmp/ca/bin/pkaput squash-release \
            --chain packablock.yaml \
            --layers 3 \
            --output-tag "tuesday-android:${GITHUB_SHA::7}" \
            --storage local

          # 3. Publish RFC 4648 Base32 DNSLink TXT record to examples.packablock.com & verify 3 Zero-Trust Gates
          /tmp/ca/bin/pkaput publish-dns --domain "examples.packablock.com" --provider coredns
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ZONE_ID" ]; then
            /tmp/ca/bin/pkaput publish-dns --domain "examples.packablock.com" --provider cloudflare
          fi
          /tmp/ca/bin/pkaput preflight-gate \
            --file bin/layers/flattened.tar.gz \
            --domain "examples.packablock.com" \
            --policy test/fixtures/packablock.policy.yaml \
            --query-pkg "androidx.compose:compose-bom" \
            --query-version "2024.10.00"

      - name: Upload Android APK & Continuous Attestation Bundle (CycloneDX SBOM, DSSEv1, CARv1)
        uses: actions/upload-artifact@v4
        with:
          name: tuesday-android-ca-bundle-${{ github.sha }}
          path: |
            packablock.yaml
            bin/release-bundle.car
            bin/layers/flattened.tar.gz
            bin/ipfs-cache/
            app/build/outputs/apk/debug/*.apk

  deploy-play-internal:
    name: "Gate 1A: Deploy AAB to Google Play Internal Testing Track"
    needs: verify-and-attest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Decode Upload Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required to sign release AAB"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/tuesday-upload.p12

      - name: Assemble Signed Release AAB Bundle
        env:
          ANDROID_KEYSTORE_PATH: /tmp/tuesday-upload.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'tuesday-upload' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Determine Google Play Auth Mode
        id: play-auth-mode
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]; then
            echo "use_explicit_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_explicit_json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP via Workload Identity Federation (Keyless Play Deploy)
        if: steps.play-auth-mode.outputs.use_explicit_json == 'false'
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/1076233850924/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "gh-deployer@tuesday-sh.iam.gserviceaccount.com"
          create_credentials_file: true

      - name: Upload to Google Play Internal Track (WIF Keyless)
        if: steps.play-auth-mode.outputs.use_explicit_json == 'false'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          packageName: sh.tuesday.app
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: Upload to Google Play Internal Track (Explicit JSON Secret Fallback)
        if: steps.play-auth-mode.outputs.use_explicit_json == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: sh.tuesday.app
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: Shred Ephemeral Upload Keystore
        if: always()
        run: rm -f /tmp/tuesday-upload.p12
