name: "Packablock Mobile CI/CD/CA (Android + pkablk + pkaput + Play Internal)"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-attest:
    name: "Test Android App, Verify Ledger, Attest SBOM & Publish DNSLink"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Run Android Unit Tests & Assemble Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Setup Bun & Packablock Client (pkablk)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Verify Packablock Supply Chain Ledger (packablock.yaml)
        run: |
          bun install -g github:Packablock/packablock-client
          pkablk check packablock.yaml
          pkablk audit packablock.yaml --visualize

      - name: Set up Go 1.24 (for pkaput Continuous Attestation Engine)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Run pkaput Squash-Release, CycloneDX SBOM & DNSLink Attestation (examples.packablock.com)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          PKABLK_REGISTRY_URL: ${{ secrets.PKABLK_REGISTRY_URL }}
          PKABLK_API_KEY: ${{ secrets.PKABLK_API_KEY }}
        run: |
          git clone --depth 1 https://github.com/aaronbronow/continuous-attestation.git /tmp/ca
          go build -C /tmp/ca -o /tmp/ca/bin/pkaput ./cmd/pkaput
          mkdir -p test/coredns test/fixtures
          cp /tmp/ca/test/coredns/db.layers.example.internal test/coredns/db.layers.example.internal
          cp /tmp/ca/test/fixtures/packablock.policy.yaml test/fixtures/packablock.policy.yaml
          cp /tmp/ca/test/fixtures/ed25519.key.json test/fixtures/ed25519.key.json

          # 1. Record release step & verify Packablock chain via pkaput + official pkablk CLI
          /tmp/ca/bin/pkaput commit-step \
            --chain packablock.yaml \
            --pkg "androidx.compose:compose-bom" \
            --from "2024.09.00" \
            --to "2024.10.00" \
            --reason "M1 Android Brand v1.2 & Play Billing Pro Tier 1 release"
          pkablk check packablock.yaml
          /tmp/ca/bin/pkaput check packablock.yaml

          # 2. Squash OCI layers, generate CycloneDX v1.5 SBOM + DSSEv1 + CARv1 bundle
          /tmp/ca/bin/pkaput squash-release \
            --chain packablock.yaml \
            --layers 3 \
            --output-tag "tuesday-android:${GITHUB_SHA::7}" \
            --storage local

          # 3. Publish RFC 4648 Base32 DNSLink TXT record to examples.packablock.com & verify 3 Zero-Trust Gates
          /tmp/ca/bin/pkaput publish-dns --domain "examples.packablock.com" --provider coredns
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ZONE_ID" ]; then
            /tmp/ca/bin/pkaput publish-dns --domain "examples.packablock.com" --provider cloudflare
          fi
          /tmp/ca/bin/pkaput preflight-gate \
            --file bin/layers/flattened.tar.gz \
            --domain "examples.packablock.com" \
            --policy test/fixtures/packablock.policy.yaml \
            --query-pkg "androidx.compose:compose-bom" \
            --query-version "2024.10.00"

      - name: Upload Android APK & Continuous Attestation Bundle (CycloneDX SBOM, DSSEv1, CARv1)
        uses: actions/upload-artifact@v4
        with:
          name: tuesday-android-ca-bundle-${{ github.sha }}
          path: |
            packablock.yaml
            bin/release-bundle.car
            bin/layers/flattened.tar.gz
            bin/ipfs-cache/
            app/build/outputs/apk/debug/*.apk

  deploy-play-internal:
    name: "Gate 1A: Deploy AAB to Google Play Internal Testing Track"
    needs: verify-and-attest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PLAY_INTERNAL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Assemble Release AAB Bundle
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload to Google Play Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: sh.tuesday.app.pro
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
